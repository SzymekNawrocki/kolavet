de_heroHeadline: "Hallo! Mein Name ist Michalina Kolarz. Ich bin Tierärztin."
de_heroSubtext: "Mich hat schon immer fasziniert, wie lebende Organismen funktionieren — präzise, empfindlich und komplex. Dieser Blog ist ein Ort, wo ich meine täglichen tierärztlichen Erfahrungen teile, damit du wirklich verstehst, was mit deinem Tier passiert und wie du ihm am besten helfen kannst."
